#!/usr/sbin/nft -f
# StagOS firewall (module firewall installs this as /etc/nftables.conf).
# Inbound is default deny; outbound is open. Everything arriving on tailscale0 is allowed, which is what
# keeps Tailscale SSH working: tailscaled answers port 22 on the tailnet address from inside the tunnel,
# so those packets only ever arrive on tailscale0. UDP 41641 stays open so peers can reach tailscaled
# directly instead of through a relay.
#
# Only table inet stagos is touched: no "flush ruleset", so the tables tailscaled and libvirt manage
# survive a reload. Reload with: sudo nft -f /etc/nftables.conf   (or: stag-fw on)
#
# Drop-ins: /etc/nftables.d/*.nft are included INSIDE chain input below, so a drop-in is rule statements
# only (no table, no chain), e.g. the KDE Connect one:  udp dport 1714-1764 accept
#
# Not affected on purpose: monitor mode on the capture card. Kismet/aircrack read the radio through
# AF_PACKET sockets, which never pass through netfilter, and the card carries no IP traffic.

table inet stagos
delete table inet stagos

table inet stagos {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state invalid drop
    ct state { established, related } accept
    iifname "lo" accept
    iifname "tailscale0" accept

    # ICMP basics (rate limited pings, the error types path MTU discovery and traceroute need)
    ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
    ip protocol icmp icmp type echo-request limit rate 10/second burst 20 packets accept
    ip6 nexthdr icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert, mld-listener-query, mld-listener-report, mld2-listener-report } accept
    ip6 nexthdr icmpv6 icmpv6 type echo-request limit rate 10/second burst 20 packets accept

    # DHCP and DHCPv6 replies, mDNS (multicast groups only)
    udp sport 67 udp dport 68 accept
    ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept
    ip daddr 224.0.0.251 udp dport 5353 accept
    ip6 daddr ff02::fb udp dport 5353 accept

    # Tailscale direct connections
    udp dport 41641 accept

    # libvirt NAT bridge: guests need DHCP and DNS from the host
    iifname "virbr*" udp dport { 53, 67 } accept
    iifname "virbr*" tcp dport 53 accept

    include "/etc/nftables.d/*.nft"

    # whatever reaches here is dropped by the policy; the counter is what `stag-fw status` shows
    counter comment "default deny"
  }
}
