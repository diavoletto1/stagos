# StagOS TLP tuning (installed to /etc/tlp.d/50-stagos.conf)
# Bluetooth and audio USB devices must never be autosuspended (dropouts, reconnect loops).
USB_AUTOSUSPEND=1
USB_EXCLUDE_BTUSB=1
USB_EXCLUDE_PHONE=1
USB_EXCLUDE_AUDIO=1
# Haswell + intel_pstate
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
