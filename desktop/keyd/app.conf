# StagOS keyd per-app overrides, read by keyd-application-mapper (not started under Plasma yet, see README, keys).
# Terminals: Cmd+C/V must not send Ctrl+C (SIGINT) or a bare Ctrl+V, and Cmd+Z/A/S/... must not
# send Ctrl+Z (suspend), Ctrl+A, Ctrl+S (XOFF)... so those become Ctrl+Shift+C/V or nothing.
# Real Ctrl+key in the terminal is never touched.
[foot]
cmd.c = C-S-c
cmd.v = C-S-v
cmd.x = noop
cmd.z = noop
cmd.a = noop
cmd.t = noop
cmd.f = noop
cmd.s = noop
cmd.q = A-f4
cmd.w = A-f4
