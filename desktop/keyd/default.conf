# StagOS keyd map: Super acts like Cmd on a Mac. Installed to /etc/keyd/default.conf.
# While Super is held the [cmd] layer keeps Meta down, so every unbound combo (Super+Return,
# Super+D, Super+Space, Super+Shift+3/4...) still reaches labwc untouched. Only the keys below
# are translated to Ctrl shortcuts. Terminals get their own (non-Ctrl) versions from app.conf.
[ids]
*

[main]
leftmeta = layer(cmd)
rightmeta = layer(cmd)

[cmd:M]
c = C-c
v = C-v
x = C-x
z = C-z
a = C-a
q = C-q
w = C-w
t = C-t
f = C-f
s = C-s

# Super+Shift+V stays the clipboard-history picker (labwc), not "paste without formatting"
[cmd+shift]
v = M-S-v
