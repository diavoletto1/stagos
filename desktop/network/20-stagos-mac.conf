# StagOS MAC privacy (module network installs this as /etc/NetworkManager/conf.d/20-stagos-mac.conf).
# Probe requests while scanning use a random MAC, and every wifi network you join gets its own MAC, stable per
# saved connection (same network, same MAC, so captive portals and DHCP leases behave) but unrelated across
# networks and to the hardware MAC. Mark a network you trust (home) to use the real hardware MAC instead:
#   stag-mac trust "<connection name>"      (stag-mac list shows the state of every wifi connection)
# Only NetworkManager-managed devices are affected; the capture card (unmanaged, monitor mode) is not.
[device-mac-randomization]
wifi.scan-rand-mac-address=yes

[connection-mac-randomization]
wifi.cloned-mac-address=stable
