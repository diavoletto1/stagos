# StagOS trackpad gestures (libinput-gestures). labwc has no ctl tool, so the swipe types the
# workspace keybinds from rc.xml (Ctrl+Alt+Left/Right) with wtype. Natural direction: swipe left
# pulls the next workspace in from the right.
gesture swipe left 3  wtype -M ctrl -M alt -k Right -m alt -m ctrl
gesture swipe right 3 wtype -M ctrl -M alt -k Left -m alt -m ctrl
