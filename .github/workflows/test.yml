# Generated by stag-system deploy/ci/gen-workflows.py. Edit the template there.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint and dry-run tooling
        run: |
          if ! command -v shellcheck >/dev/null || ! command -v xmllint >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck libxml2-utils
          fi
      - name: Dry-run harness (shellcheck, xmllint, provision dry runs)
        run: ./test/dryrun.sh

  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No em dashes, no AI trailers
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          empty_tree=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = pull_request ]; then
            diff_range="$PR_BASE...$PR_HEAD"
            log_range="$PR_BASE..$PR_HEAD"
          else
            head=$PUSH_AFTER
            base=$PUSH_BEFORE
            if [ "$base" = "$zero" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base=$(git rev-parse --verify -q "$head~1" || echo "$empty_tree")
            fi
            diff_range="$base $head"
            if [ "$base" = "$empty_tree" ]; then log_range="-1 $head"; else log_range="$base..$head"; fi
          fi
          em=$(printf '\342\200\224')
          fail=0
          # shellcheck disable=SC2086
          if git -c core.quotepath=off diff --name-only $diff_range | grep -F -- "$em"; then
            echo "::error::em dash (U+2014) in a changed file name"; fail=1
          fi
          # shellcheck disable=SC2086
          added=$(git diff -U0 --no-color $diff_range | grep -E '^[+]' | grep -vE '^[+]{3} ' || true)
          if printf '%s\n' "$added" | grep -nF -- "$em"; then
            echo "::error::em dash (U+2014) in added lines above; use a hyphen, comma, or colon"; fail=1
          fi
          # shellcheck disable=SC2086
          msgs=$(git log --format='commit %h%n%B' $log_range)
          if printf '%s\n' "$msgs" | grep -niE '^[[:space:]]*co-authored-by:|generated with'; then
            echo "::error::AI trailer (Co-Authored-By / Generated with) in a commit message"; fail=1
          fi
          if printf '%s\n' "$msgs" | grep -nF -- "$em"; then
            echo "::error::em dash (U+2014) in a commit message"; fail=1
          fi
          exit $fail
