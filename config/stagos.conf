# StagOS build config -- edit before running install.sh
# shellcheck disable=SC2034  # sourced config; vars consumed by install/provision
# Sourced by install.sh and provision.sh.

# ---- target device (X1 Carbon Gen2 = M.2 SATA, usually /dev/sda) ----
STAGOS_DISK=""                    # Leave empty: install.sh lists disks and asks. Or hardcode e.g. /dev/sda.
STAGOS_HOSTNAME="stagpad"
STAGOS_USER="jack"
STAGOS_TIMEZONE="America/New_York"
STAGOS_LOCALE="en_US.UTF-8"
STAGOS_KEYMAP="us"

# ---- disk layout ----
STAGOS_LUKS=1                     # 1 = LUKS2 full-disk encryption on root (recommended for a mobile box)
STAGOS_EFI_SIZE="512MiB"
STAGOS_FS="ext4"                  # ext4 | btrfs
# No swap partition: 8GB soldered RAM, zram is set up in provisioning instead.

# ---- bootloader / kernel ----
STAGOS_BOOTLOADER="grub"          # grub -- required for StagOS grub theme + plymouth branding
STAGOS_KERNEL="linux-lts"         # linux-lts safer on 2014 hardware; use "linux" for newest
