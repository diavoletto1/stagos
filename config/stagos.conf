# StagOS build config -- edit before running install.sh
# shellcheck disable=SC2034  # sourced config; vars consumed by install/provision
# Sourced by install.sh and provision.sh.

# ---- target device (X1 Carbon Gen2 = M.2 SATA, usually /dev/sda) ----
STAGOS_DISK=""                    # Leave empty: install.sh lists disks and asks. Or hardcode e.g. /dev/sda.
STAGOS_HOSTNAME="stagpad"
STAGOS_USER="jack"
STAGOS_TIMEZONE="America/New_York"
STAGOS_LOCALE="en_US.UTF-8"
STAGOS_KEYMAP="us"

# ---- disk layout ----
STAGOS_LUKS=1                     # 1 = LUKS2 full-disk encryption on root (recommended for a mobile box)
STAGOS_EFI_SIZE="512MiB"
STAGOS_FS="ext4"                  # ext4 | btrfs
# No swap partition: 8GB soldered RAM, zram is set up in provisioning instead.

# ---- bootloader / kernel ----
STAGOS_BOOTLOADER="grub"          # grub -- required for StagOS grub theme + plymouth branding
STAGOS_KERNEL="linux-lts"         # linux-lts safer on 2014 hardware; use "linux" for newest

# ---- capture card ----
STAGOS_CAPTURE_IFACE="${STAGOS_CAPTURE_IFACE:-}"         # Set to the ADD-ON card iface (e.g. wlan1) once installed. Never the built-in card.
# ---- desktop ----
STAGOS_DESKTOP="${STAGOS_DESKTOP:-1}"   # 1 = install the StagOS desktop (KDE Plasma); 0 = stay terminal-only
STAGOS_AUTOLOGIN="${STAGOS_AUTOLOGIN:-1}"  # 1 = boot unlock screen is the login; tty1 logs in automatically after it

# ---- desktop modules (stagos-desktop) ----
# Private values (stag host, restic remote) live in config/local.conf (untracked; see local.conf.example).
STAGOS_OUTPUT_SCALE="${STAGOS_OUTPUT_SCALE:-1.5}"          # panel scale on the internal 1440p display
STAGOS_KEYRING_EMPTY="${STAGOS_KEYRING_EMPTY:-0}"          # 1 = empty-password login keyring (autologin means PAM never unlocks it)
STAGOS_FLATPAK_APPS="${STAGOS_FLATPAK_APPS:-com.bambulab.BambuStudio org.localsend.localsend_app}"
STAGOS_DESKTOP_PLASMA="${STAGOS_DESKTOP_PLASMA:-1}"        # 1 = module plasma installs the KDE Plasma 6 session; 0 = skip it (no desktop session)

# ---- battery (module power: TLP charge thresholds, ThinkPad natacpi; stag-battery full charges to 100% once) ----
STAGOS_BAT_START="${STAGOS_BAT_START:-75}"   # charging starts below this %
STAGOS_BAT_STOP="${STAGOS_BAT_STOP:-80}"     # and stops at this %
STAGOS_BAT_FULL="${STAGOS_BAT_FULL:-0}"      # 1 = no thresholds: always charge to 100% (hardware defaults 96/100)
# optimized charging (macOS style): hold at STOP on AC, learn the usual unplug time (last 14 days, weekdays
# and weekends apart, acts after 5 steady weekdays / 3 weekends), charge to 100% shortly before it
STAGOS_BAT_OPTIMIZED="${STAGOS_BAT_OPTIMIZED:-1}"      # 0 = plain START/STOP thresholds, no top-off
STAGOS_BAT_TOPOFF_LEAD="${STAGOS_BAT_TOPOFF_LEAD:-90}" # minutes before the predicted unplug to start the top-off
STAGOS_BAT_WAKE="${STAGOS_BAT_WAKE:-1}"                # 1 = wake a laptop suspended on AC for the top-off
